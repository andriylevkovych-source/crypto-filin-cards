name: render-cards
on:
  # Runs are triggered by Make.com (scenario «запуск картинок GitHub») at exact times;
  # GitHub's own cron was delayed by hours, so it is no longer used.
  workflow_dispatch:
    inputs:
      kind:
        description: 'daily | etf | deriv | weekly | liq | gap | all'
        default: 'all'
      slot:
        description: 'Daily card label (УТРО / ВЕЧЕР)'
        default: 'УТРО'
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Pick card
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '45 5 * * *')   echo "kind=daily"  >> $GITHUB_OUTPUT; echo "slot=УТРО"  >> $GITHUB_OUTPUT ;;
            '10 19 * * *')  echo "kind=daily"  >> $GITHUB_OUTPUT; echo "slot=ВЕЧЕР" >> $GITHUB_OUTPUT ;;
            '40 5 * * 2-6') echo "kind=etf"    >> $GITHUB_OUTPUT ;;
            '30 10 * * *')  echo "kind=deriv"  >> $GITHUB_OUTPUT ;;
            '0 15 * * 0')   echo "kind=weekly" >> $GITHUB_OUTPUT ;;
            '15 7 * * *')   echo "kind=liq"    >> $GITHUB_OUTPUT ;;
            '10 23 * * 0')  echo "kind=gap"    >> $GITHUB_OUTPUT ;;
            *)              echo "kind=${{ inputs.kind || 'all' }}" >> $GITHUB_OUTPUT; echo "slot=${{ inputs.slot || 'УТРО' }}" >> $GITHUB_OUTPUT ;;
          esac
      - env:
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: node src/render.js ${{ steps.pick.outputs.kind }} --slot "${{ steps.pick.outputs.slot || 'УТРО' }}"
      - name: Commit images
        run: |
          git config user.name "crypto-filin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/*.png out/*.json
          git commit -m "render ${{ steps.pick.outputs.kind }} $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase && git push
